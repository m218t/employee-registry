services:
  db:
    image: postgres:15
    container_name: hr-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: employees
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d employees" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../api
    container_name: hr-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: app
      DB_PASSWORD: secret
      DB_DATABASE: employees
      NODE_ENV: production
    restart: unless-stopped

volumes:
  db-data:
